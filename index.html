<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factura - Roman Fit</title>

  <style>
    :root{
      --paper: 72mm;
      --pad: 10px;
      --f1: 13px;
      --f2: 12px;
      --f3: 11px;
      --f4: 10px;
      --line: 1px solid #000;
      --dash: 1px dashed #000;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      padding:0;
      width:var(--paper);
      font-family: Arial, sans-serif;
      color:#000;
    }

    .header{
      padding: var(--pad) var(--pad) 6px;
      text-align:center;
    }
    .logo-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:6px;
    }
    .meta{
      font-size: var(--f3);
      line-height: 1.25;
    }
    .meta strong{ font-weight:700; }
    .divider{
      border-top: var(--line);
      margin: 8px var(--pad);
    }

    .info{
      padding: 0 var(--pad);
      font-size: var(--f2);
      line-height: 1.3;
    }
    .badge{
      display:inline-block;
      border:1px solid #000;
      padding:2px 6px;
      border-radius: 999px;
      font-size: var(--f4);
      font-weight:700;
      letter-spacing:.2px;
      vertical-align: middle;
      margin-left: 6px;
    }

    .section-title{
      padding: 6px var(--pad) 0;
      font-size: var(--f1);
      font-weight:700;
    }
    table{
      width:100%;
      border-collapse: collapse;
      margin-top: 6px;
    }
    thead th{
      font-size: var(--f3);
      padding: 5px 6px;
      border-bottom: var(--line);
      text-align:left;
    }
    tbody td{
      font-size: var(--f3);
      padding: 6px 6px;
      border-bottom: var(--dash);
      vertical-align: top;
    }
    .right{ text-align:right; }
    .nowrap{ white-space:nowrap; }

    .totals{
      padding: 8px var(--pad) 0;
      font-size: var(--f2);
    }
    .totals .trow{
      display:flex;
      justify-content:space-between;
      margin: 4px 0;
    }
    .totals .grand{
      border-top: var(--line);
      padding-top: 8px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .footer{
      padding: 10px var(--pad) 10px;
      border-top: var(--line);
      margin-top: 10px;
      font-size: var(--f4);
      line-height: 1.25;
      text-align: justify;
    }

    @media print{
      body{ width: var(--paper); }
      tr{ page-break-inside: avoid; }
    }
  </style>

  <script>
    // ---------- Helpers ----------
    const qs = new URLSearchParams(location.search);

    const get = (k, d="") => {
      const v = qs.get(k);
      return (v === null || v === undefined) ? d : v;
    };

    const splitList = (v) => {
      if (!v) return [];
      return String(v).split(",").map(s => s.trim()).filter(Boolean);
    };

    const toNum = (v, def=0) => {
      if (v === null || v === undefined || v === "") return def;
      const cleaned = String(v).replace(/,/g,"").trim();
      const n = Number(cleaned);
      return Number.isFinite(n) ? n : def;
    };

    const money = (n) => {
      const num = Number(n || 0);
      return "$" + num.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    // Tu fecha viene "02/04/2026" (MDY)
    const parseMDY = (mdy) => {
      if (!mdy) return null;
      const [mm, dd, yyyy] = String(mdy).split("/").map(x => parseInt(x,10));
      if (!mm || !dd || !yyyy) return null;
      const d = new Date(yyyy, mm-1, dd);
      return isNaN(d.getTime()) ? null : d;
    };

    const fmtDate = (d) => d
      ? d.toLocaleDateString("es-DO", { day:"2-digit", month:"2-digit", year:"numeric" })
      : "";

    const fmtTime12 = (hhmmss) => {
      if (!hhmmss) return "";
      const [h,m,s] = String(hhmmss).split(":").map(x => parseInt(x,10) || 0);
      const d = new Date();
      d.setHours(h,m,s,0);
      return d.toLocaleTimeString("es-DO", { hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true });
    };

    function escapeHtml(str){
      return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function renderFactura(){
      // Params base (no cambiamos nombres en URL para no romper AppSheet)
      const venta = get("boleta", "—");
      const cliente = get("mesa", "—");
      const fechaStr = get("fecha", "");
      const estado = get("estado", "—");

      // Extras
      const direccion = get("direccion", "");
      const domiStr = get("domi", "");
      const propinaStr = get("propina", "");

      // Hora (si quieres mostrarla junto a fecha usa &hora= o usas fecha_entrega)
      const hora = get("hora", "") || get("fecha_entrega", "");

      // Listas
      const serviciosRaw = get("servicios", "");
      const cantidadesRaw = get("cantidades", "");
      const punitRaw = get("p_unit", "");

      let servicios = splitList(serviciosRaw);
      let cantidades = splitList(cantidadesRaw);
      let punits = splitList(punitRaw);

      if (servicios.length === 0 && serviciosRaw) servicios = [serviciosRaw];
      if (cantidades.length === 0 && cantidadesRaw) cantidades = [cantidadesRaw];
      if (punits.length === 0 && punitRaw) punits = [punitRaw];

      const maxLen = Math.max(servicios.length, cantidades.length, punits.length, 1);
      while (servicios.length < maxLen) servicios.push(servicios[servicios.length-1] || "Servicio");
      while (cantidades.length < maxLen) cantidades.push(cantidades[cantidades.length-1] || "1");
      while (punits.length < maxLen) punits.push(punits[punits.length-1] || "0");

      // Totales del link
      const total = toNum(get("total","0"), 0);

      // En tu app: descuento = efectivo recibido, subtotal_desc = devuelta
      const recibido = toNum(get("descuento",""), 0);
      const devuelta = toNum(get("subtotal_desc",""), 0);

      const domi = toNum(domiStr, 0);
      const propina = toNum(propinaStr, 0);

      // Header
      document.getElementById("venta").textContent = venta;
      document.getElementById("cliente").textContent = cliente;

      const d = parseMDY(fechaStr);
      const fechaNice = d ? fmtDate(d) : (fechaStr || "—");
      const horaNice = hora ? fmtTime12(hora) : "";
      document.getElementById("fecha").textContent = horaNice ? `${fechaNice} ${horaNice}` : fechaNice;

      const badge = document.getElementById("estado");
      badge.textContent = estado || "—";

      // Extras visibles si aplican
      const extras = [];
      if (direccion) extras.push(`<div><strong>Dirección:</strong> ${escapeHtml(direccion)}</div>`);
      if (domiStr !== "" && domi > 0) extras.push(`<div><strong>Domicilio:</strong> ${money(domi)}</div>`);
      if (propinaStr !== "" && propina > 0) extras.push(`<div><strong>Propina:</strong> ${money(propina)}</div>`);

      const extrasBox = document.getElementById("extras");
      if (extras.length) {
        extrasBox.innerHTML = extras.join("");
        extrasBox.style.display = "block";
      } else {
        extrasBox.style.display = "none";
      }

      // Tabla con ITBIS incluido
      const tbody = document.getElementById("items");
      tbody.innerHTML = "";

      const ITBIS_RATE = 0.18;

      let sumValor = 0;     // total final (incluye itbis)
      let sumItbis = 0;     // itbis total
      let sumBase = 0;      // subtotal sin itbis

      for (let i = 0; i < maxLen; i++){
        const name = decodeURIComponent(servicios[i] || "");
        const qty = toNum(cantidades[i], 1);

        // p_unit viene como precio final (incluye itbis)
        const pFinal = toNum(punits[i], 0);

        // base e itbis unitarios (itbis incluido)
        const pBase = pFinal / (1 + ITBIS_RATE);
        const pItbis = pFinal - pBase;

        const lineBase = qty * pBase;
        const lineItbis = qty * pItbis;
        const lineValor = qty * pFinal;

        sumBase += lineBase;
        sumItbis += lineItbis;
        sumValor += lineValor;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(name)}</td>
          <td class="right nowrap">${qty}x${money(pBase)}</td>
          <td class="right nowrap">${money(lineItbis)}</td>
          <td class="right nowrap">${money(lineValor)}</td>
        `;
        tbody.appendChild(tr);
      }

      // Si total viene en URL, lo respetamos como total final base
      const totalFinal = total > 0 ? total : sumValor;

      // Totales abajo
      document.getElementById("subtotal").textContent = money(total > 0 ? (totalFinal - sumItbis) : sumBase);
      document.getElementById("itbis").textContent = money(sumItbis);
      document.getElementById("total").textContent = money(totalFinal + domi + propina);

      // Recibido / devuelta solo si vienen
      const rowRecibido = document.getElementById("rowRecibido");
      const rowDevuelta = document.getElementById("rowDevuelta");

      if (get("descuento","") !== "") {
        rowRecibido.style.display = "flex";
        document.getElementById("recibidoVal").textContent = money(recibido);
      } else {
        rowRecibido.style.display = "none";
      }

      if (get("subtotal_desc","") !== "") {
        rowDevuelta.style.display = "flex";
        document.getElementById("devueltaVal").textContent = money(devuelta);
      } else {
        rowDevuelta.style.display = "none";
      }

      // Auto print
      const autoprint = get("autoprint", "1");
      if (autoprint !== "0") {
        setTimeout(() => window.print(), 250);
      }
    }
  </script>
</head>

<body onload="renderFactura()">

  <div class="header">
    <div class="logo-wrap">
      <!-- ✅ LOGO HTML (SVG) "Roman Fit" -->
      <svg width="210" height="46" viewBox="0 0 210 46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roman Fit">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#000"/>
            <stop offset="1" stop-color="#444"/>
          </linearGradient>
          <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#111"/>
            <stop offset="1" stop-color="#777"/>
          </linearGradient>
        </defs>

        <g transform="translate(0,2)">
          <rect x="0" y="0" rx="10" ry="10" width="42" height="42" fill="url(#g)" />
          <path d="M12 30V12h10c5 0 8 2 8 7 0 4-2 6-5 7l6 4h-6l-5-4h-2v4h-6zm6-9h4c2 0 3-1 3-2.5S24 16 22 16h-4v5z"
                fill="#fff" opacity="0.92"/>
          <path d="M18 34h18" stroke="#fff" stroke-width="2" opacity="0.35"/>
        </g>

        <g transform="translate(54,7)">
          <text x="0" y="18" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#000">Roman</text>
          <text x="88" y="18" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="url(#accent)">Fit</text>
          <rect x="0" y="24" width="140" height="2" fill="#000" opacity="0.15"/>
          <text x="0" y="38" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#000" opacity="0.65">
            FACTURA / RECIBO
          </text>
        </g>
      </svg>
    </div>

    <div class="meta">
      <div><strong>Venta:</strong> <span id="venta">—</span></div>
      <div><strong>Cliente:</strong> <span id="cliente">—</span></div>
      <div><strong>Fecha:</strong> <span id="fecha">—</span> <span class="badge" id="estado">—</span></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="info" id="extras" style="display:none;"></div>

  <div class="section-title">Detalle</div>

  <table>
    <thead>
      <tr>
        <th>Servicio</th>
        <th class="right">Cant.</th>
        <th class="right">ITBIS</th>
        <th class="right">Valor</th>
      </tr>
    </thead>
    <tbody id="items"></tbody>
  </table>

  <div class="totals">
    <div class="trow"><span>Subtotal (sin ITBIS):</span><strong id="subtotal">$0.00</strong></div>
    <div class="trow"><span>ITBIS (18%):</span><strong id="itbis">$0.00</strong></div>
    <div class="trow grand"><span>Total a Pagar:</span><span id="total">$0.00</span></div>

    <div class="trow" id="rowRecibido" style="display:none;">
      <span>Recibido:</span><span id="recibidoVal">$0.00</span>
    </div>

    <div class="trow" id="rowDevuelta" style="display:none;">
      <span>Devuelta:</span><span id="devueltaVal">$0.00</span>
    </div>
  </div>

  <div class="footer">
    Gracias por preferir <strong>Roman Fit</strong>.
    Este comprobante fue generado automáticamente. Conserve este recibo para cualquier aclaración.
  </div>

</body>
</html>
